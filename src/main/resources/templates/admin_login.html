<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>管理员登录</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <h1>管理员登录</h1>

    <div class="top-bar">
        <a th:href="@{/login}" class="btn back-btn">返回运动员登录</a>
    </div>

    <div class="form-card">
        <h2>管理员账号</h2>

        <div th:if="${error}" class="msg-error">账号或密码错误，请重试</div>
        <div th:if="${portalMismatch}" class="msg-error">运动员账号不可从管理员入口登录</div>

        <form th:action="@{/perform-login}" method="post" class="athlete-form">
            <input type="hidden" name="portal" value="admin">
            <div class="form-row">
                <label>账号</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-row">
                <label>密码</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn primary-btn">登录</button>
        </form>
    </div>
</div>
</body>
</html>
