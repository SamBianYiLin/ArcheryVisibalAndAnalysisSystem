<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>运动员历史分析</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/analysis.css}">
</head>
<body>
<div class="analysis-page">
    <div class="container">
        <div class="page-header">
            <div class="page-title-box">
                <h1>运动员历史分析</h1>
                <p>查看运动员历史成绩、肌群分布与详细训练记录</p>
            </div>

            <div class="top-bar">
                <a th:href="@{/analysis}" class="btn back-btn">返回运动员选择</a>
                <a th:href="@{/athletes}" class="btn back-btn">返回运动员管理</a>
            </div>
        </div>

        <div class="panel-card athlete-card">
            <div class="section-header">
                <h2>运动员信息</h2>
                <span class="section-badge">Athlete Profile</span>
            </div>

            <div class="athlete-info-grid">
                <div class="info-item">
                    <span class="info-label">ID</span>
                    <span class="info-value" th:text="${athlete.id}"></span>
                </div>
                <div class="info-item">
                    <span class="info-label">编号</span>
                    <span class="info-value" th:text="${athlete.athleteNo}"></span>
                </div>
                <div class="info-item">
                    <span class="info-label">姓名</span>
                    <span class="info-value" th:text="${athlete.name}"></span>
                </div>
                <div class="info-item">
                    <span class="info-label">性别</span>
                    <span class="info-value" th:text="${athlete.gender}"></span>
                </div>
                <div class="info-item">
                    <span class="info-label">年龄</span>
                    <span class="info-value" th:text="${athlete.age}"></span>
                </div>
                <div class="info-item">
                    <span class="info-label">级别</span>
                    <span class="info-value" th:text="${athlete.levelName}"></span>
                </div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">总射箭次数</div>
                <div class="stat-value number-animate" th:text="${analysisData.totalCount}">0</div>
                <div class="stat-desc">累计训练记录</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">平均环数</div>
                <div class="stat-value number-animate" th:text="${analysisData.avgScore}">0</div>
                <div class="stat-desc">整体平均水平</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">最好成绩</div>
                <div class="stat-value number-animate" th:text="${analysisData.bestScore}">0</div>
                <div class="stat-desc">历史最佳表现</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">10环率</div>
                <div class="stat-value number-animate" th:text="${analysisData.tenRate + '%'}">0%</div>
                <div class="stat-desc">高分命中占比</div>
            </div>
        </div>

        <div class="panel-card">
            <div class="section-header">
                <h2>主发力肌群统计</h2>
                <span class="section-badge">Muscle Stats</span>
            </div>

            <div class="empty-box" th:if="${analysisData.totalCount == 0}">
                暂无历史记录，无法分析。
            </div>

            <div class="table-wrap" th:if="${analysisData.totalCount > 0}">
                <table>
                    <thead>
                    <tr>
                        <th>主发力肌肉</th>
                        <th>出现次数</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="entry : ${analysisData.muscleStats.entrySet()}">
                        <td th:text="${entry.key}"></td>
                        <td>
                            <span class="count-badge" th:text="${entry.value}"></span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="panel-card table-card">
            <div class="section-header">
                <h2>历史记录明细</h2>
                <span class="section-badge">History Records</span>
            </div>

            <div class="empty-box" th:if="${analysisData.totalCount == 0}">
                暂无历史记录。
            </div>

            <div class="table-wrap" th:if="${analysisData.totalCount > 0}">
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>环数</th>
                        <th>主发力肌肉</th>
                        <th>协同发力肌肉</th>
                        <th>备注</th>
                        <th>时间</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${analysisData.records}">
                        <td th:text="${r.id}"></td>
                        <td>
                            <span class="score-tag" th:text="${r.score}"></span>
                        </td>
                        <td th:text="${r.mainMuscle}"></td>
                        <td th:text="${r.synergyMuscles}"></td>
                        <td class="remark-cell" th:text="${r.remark}"></td>
                        <td class="time-cell" th:text="${r.createdAt}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/analysis.js}"></script>
</body>
</html>
