<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>射箭数据分析</title>
    <link rel="stylesheet" href="/css/analysis.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
<div class="container">
    <div class="page-header">
        <div class="header-left">
            <h1>射箭数据分析面板</h1>
            <p>查看运动员训练记录、成绩趋势与肌肉状态统计</p>
        </div>
        <div class="header-right">
            <input id="athleteIdInput" class="input-box" type="number" placeholder="请输入运动员 ID">
            <button class="btn btn-primary" onclick="loadAnalysis()">加载分析</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-title">总记录数</div>
            <div class="stat-value" id="totalCount">0</div>
            <div class="stat-sub">累计训练记录</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">平均成绩</div>
            <div class="stat-value" id="avgScore">0.0</div>
            <div class="stat-sub">整体表现均值</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">最高成绩</div>
            <div class="stat-value" id="bestScore">0</div>
            <div class="stat-sub">历史最佳成绩</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">10环率</div>
            <div class="stat-value" id="tenRate">0%</div>
            <div class="stat-sub">命中高分占比</div>
        </div>
    </div>

    <div class="content-grid">
        <div class="card">
            <div class="card-header">
                <div>
                    <div class="card-title">成绩变化趋势</div>
                    <div class="card-desc">最近训练记录分数折线图</div>
                </div>
            </div>
            <div id="scoreChart" class="chart-box"></div>
        </div>

        <div class="card">
            <div class="card-header">
                <div>
                    <div class="card-title">肌肉状态分布</div>
                    <div class="card-desc">训练过程中肌肉状态统计</div>
                </div>
            </div>
            <div id="muscleChart" class="chart-box"></div>
        </div>
    </div>

    <div class="card table-card">
        <div class="card-header">
            <div>
                <div class="card-title">训练记录明细</div>
                <div class="card-desc">按时间倒序展示运动员训练数据</div>
            </div>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>序号</th>
                    <th>成绩</th>
                    <th>肌肉状态</th>
                    <th>训练时间</th>
                </tr>
                </thead>
                <tbody id="recordTableBody">
                <tr>
                    <td colspan="4" class="empty-box">请输入运动员 ID 后加载数据</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="/js/analysis.js"></script>
</body>
</html>
