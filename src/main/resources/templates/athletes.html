<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>运动员管理</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <h1>运动员管理</h1>

    <div class="top-bar">
        <a href="/" class="btn back-btn">返回首页</a>
    </div>

    <div class="form-card">
        <h2>新增运动员</h2>
        <form th:action="@{/athletes/add}" method="post" class="athlete-form">

            <div class="form-row">
                <label>姓名</label>
                <input type="text" name="name" required>
            </div>

            <div class="form-row">
                <label>性别</label>
                <select name="gender">
                    <option value="男">男</option>
                    <option value="女">女</option>
                    <option value="其他">其他</option>
                </select>
            </div>

            <div class="form-row">
                <label>年龄</label>
                <input type="number" name="age">
            </div>

            <div class="form-row">
                <label>身高(cm)</label>
                <input type="number" step="0.1" name="height">
            </div>

            <div class="form-row">
                <label>臂展(cm)</label>
                <input type="number" step="0.1" name="armSpan">
            </div>

            <div class="form-row">
                <label>级别</label>
                <input type="text" name="levelName">
            </div>

            <div class="form-row">
                <label>备注</label>
                <input type="text" name="remark">
            </div>

            <button type="submit" class="btn primary-btn">新增运动员</button>
        </form>
    </div>

    <div class="table-card">
        <h2>运动员列表</h2>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>编号</th>
                <th>姓名</th>
                <th>性别</th>
                <th>年龄</th>
                <th>身高</th>
                <th>臂展</th>
                <th>级别</th>
                <th>备注</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="a : ${athletes}">
                <td th:text="${a.id}"></td>
                <td th:text="${a.athleteNo}"></td>
                <td th:text="${a.name}"></td>
                <td th:text="${a.gender}"></td>
                <td th:text="${a.age}"></td>
                <td th:text="${a.height}"></td>
                <td th:text="${a.armSpan}"></td>
                <td th:text="${a.levelName}"></td>
                <td th:text="${a.remark}"></td>
                <td class="action-cell">
                    <a th:href="@{'/shoot/' + ${a.id}}" class="btn small-btn">开始射箭</a>
                    <a th:href="@{'/athletes/delete/' + ${a.id}}" class="btn small-btn danger-btn"
                       onclick="return confirm('确定删除该运动员吗？');">删除</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
