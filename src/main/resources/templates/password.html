<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>修改密码</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <div class="page-header">
        <h1>修改密码</h1>
        <a th:if="${!isAdmin}" th:href="@{/auth/profile}" class="user-chip" th:text="${currentAthleteName}">运动员</a>
        <span th:if="${isAdmin}" class="user-chip">管理员</span>
    </div>

    <div class="top-bar">
        <a href="/" class="btn back-btn">返回首页</a>
    </div>

    <div class="form-card">
        <h2>密码设置</h2>

        <div th:if="${error}" th:text="${error}" class="msg-error"></div>
        <div th:if="${success}" th:text="${success}" class="msg-success"></div>

        <form th:action="@{/auth/password}" method="post" class="athlete-form">
            <div class="form-row">
                <label>当前密码</label>
                <input type="password" name="currentPassword" required>
            </div>
            <div class="form-row">
                <label>新密码</label>
                <input type="password" name="newPassword" minlength="6" required>
            </div>
            <div class="form-row">
                <label>确认新密码</label>
                <input type="password" name="confirmPassword" minlength="6" required>
            </div>
            <button type="submit" class="btn primary-btn">保存新密码</button>
        </form>
    </div>
</div>
</body>
</html>
