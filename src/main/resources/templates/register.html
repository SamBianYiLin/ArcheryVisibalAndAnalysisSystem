<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>运动员注册</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <h1>运动员账号注册</h1>
    <p class="subtitle">仅支持运动员账号注册，管理员账号由系统维护</p>

    <div class="top-bar">
        <a href="/login" class="btn back-btn">返回登录</a>
    </div>

    <div class="form-card">
        <h2>注册信息</h2>

        <div th:if="${error}" th:text="${error}" class="msg-error"></div>
        <div th:if="${success}" th:text="${success}" class="msg-success"></div>

        <form th:action="@{/auth/register}" method="post" class="athlete-form">
            <div class="form-row">
                <label>账号</label>
                <input type="text" name="username" pattern="[A-Za-z0-9]+" title="只能输入字母和数字" required>
            </div>
            <div class="form-row">
                <label>密码</label>
                <input type="password" name="password" minlength="6" required>
            </div>
            <div class="form-row">
                <label>确认密码</label>
                <input type="password" name="confirmPassword" minlength="6" required>
            </div>

            <div class="form-row">
                <label>姓名</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-row">
                <label>性别</label>
                <select name="gender">
                    <option value="男">男</option>
                    <option value="女">女</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="form-row">
                <label>年龄</label>
                <input type="number" name="age">
            </div>
            <div class="form-row">
                <label>身高(cm)</label>
                <input type="number" step="0.1" name="height">
            </div>
            <div class="form-row">
                <label>臂展(cm)</label>
                <input type="number" step="0.1" name="armSpan">
            </div>
            <div class="form-row">
                <label>级别</label>
                <input type="text" name="levelName">
            </div>
            <div class="form-row">
                <label>备注</label>
                <input type="text" name="remark">
            </div>

            <button type="submit" class="btn primary-btn">注册</button>
        </form>
    </div>
</div>
</body>
</html>
